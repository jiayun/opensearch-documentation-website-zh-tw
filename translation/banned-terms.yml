# Mainland China vocabulary that must not appear in zh-TW prose.
#
# Checked by `python3 scripts/translation.py check` and after every model
# translation. Only prose is scanned: fenced code, inline code, Liquid,
# URLs, HTML tags/comments and other protected regions are ignored.
#
# severity:
#   error   - fails the translation (retranslated with findings) and the
#             publish check.
#   warning - reported only; the word has legitimate Taiwan usages, so the
#             reviewer decides.
# exceptions: phrases in which the term is correct Taiwan usage. An
#   occurrence inside an exception phrase is ignored.

terms:
  - {term: 註釋, preferred: 註解}
  - {term: 添加, preferred: 新增}
  - {term: 本地, preferred: 本機, exceptions: [本地化]}
