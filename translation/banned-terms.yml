# Characters that exist only in Simplified Chinese. Any occurrence in prose is
# an error. Characters that are also valid Traditional characters (系, 后, 里,
# 于, 只, ...) are deliberately excluded.
simplified_characters: 们这说时来过还发开关门问题应该对实现进动态组织联库软网络设计无图标页签输换选择处录环构层确认请将从为个数务储节点码类参资讯证权线执运书写读记视频显报错误启帮转载删创级档链结检词语义间么吗样让给并与种达区条头东车长单双历

# Phrases in which a character above is intentionally kept (none yet).
simplified_exceptions: []
