# zh-TW glossary for the OpenSearch documentation.
#
# Included verbatim in every translation and review prompt. Changing this file
# changes the prompt version, which invalidates cached chunk translations.
#
# keep_in_english: names that are never translated.
# terms: preferred Taiwan rendering. Where a note says "keep English", keep the
#   English word (it is an API/product concept); add the Chinese gloss in
#   parentheses only on first use when it helps the reader.

keep_in_english:
  - OpenSearch
  - OpenSearch Dashboards
  - OpenSearch Benchmark
  - Data Prepper
  - Query DSL
  - PPL
  - SQL
  - REST API
  - Dev Tools
  - Docker
  - Docker Compose
  - Kubernetes
  - Helm
  - JSON
  - YAML
  - Lucene
  - Elasticsearch
  - k-NN
  - Painless
  - API, field, parameter, setting, plugin, processor and index names written in code

terms:
