layout: table_wrappers

<!DOCTYPE html>
<html lang="{{ site.lang | default: 'zh-TW' }}" data-pagefind-ignore="all">
{% include head.html %}
<body>
{% include header.html %}
<div class="main-content-wrap-home">
  <div id="main-content" class="main-content" role="main">
    <h1>搜尋 OpenSearch 3.9 文件</h1>
    <div class="search-page--wrapper">
      <div class="search-page--input-container">
        <div class="search-page--results--wrapper">
          <input type="search" class="search-page--results--input-box" id="searchPageInput" placeholder="搜尋文件" aria-label="搜尋字詞" autocomplete="off">
          <button type="button" id="searchSubmit">搜尋</button>
        </div>
      </div>
      <div class="search-page">
        <aside class="search-page--sidebar">
          <h2>篩選結果</h2>
          <label for="searchSection">文件分類</label>
          <select id="searchSection"><option value="">所有文件</option></select>
        </aside>
        <div class="search-page--results">
          <section class="search-page--results--display" aria-label="搜尋結果">
            <h2 class="search-page--results--display--header" id="searchPageResultsHeader" aria-live="polite">請輸入搜尋字詞。</h2>
            <div class="search-page--results--display--container" id="searchPageResultsContainer"></div>
            <button type="button" id="searchMore" hidden>顯示更多結果</button>
          </section>
        </div>
      </div>
    </div>
  </div>
</div>
{% include footer.html %}
<script src="{{ '/assets/js/theme-toggle.js' | relative_url }}"></script>
<script src="{{ '/assets/js/search.js' | relative_url }}"></script>
<script src="{{ '/assets/js/home-listener.js' | relative_url }}"></script>
</body>
</html>
